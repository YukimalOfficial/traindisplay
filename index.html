<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3色LED シミュレーター & 動画書き出し</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
        .led-container { position: relative; width: 800px; height: 90px; background-color: #050505; border: 6px solid #252525; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 20px #000, 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 30px; display: flex; align-items: center; }
        .led-text { position: absolute; white-space: nowrap; font-family: 'DotGothic16', sans-serif; font-size: 58px; letter-spacing: 4px; will-change: transform, opacity; color: #ff9900; text-shadow: 0 0 8px #ff5500, 0 0 3px #ff9900; }
        .led-text span.g { color: #33ff33; text-shadow: 0 0 8px #00aa00, 0 0 3px #33ff33; } 
        .led-text span.r { color: #ff2200; text-shadow: 0 0 8px #aa0000, 0 0 3px #ff2200; } 
        .led-text span.y { color: #ff9900; text-shadow: 0 0 8px #ff5500, 0 0 3px #ff9900; } 
        .color-amber { color: #ff9900 !important; text-shadow: 0 0 8px #ff5500 !important; }
        .color-green { color: #33ff33 !important; text-shadow: 0 0 8px #00aa00 !important; }
        .color-red   { color: #ff2200 !important; text-shadow: 0 0 8px #aa0000 !important; }
        .color-amber span, .color-green span, .color-red span { color: inherit !important; text-shadow: inherit !important; }
        .led-dot-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; background-image: linear-gradient(90deg, rgba(0,0,0,0.72) 1px, transparent 1px), linear-gradient(0deg, rgba(0,0,0,0.72) 1px, transparent 1px); background-size: 3px 3px; }
        .mode-center-layout { position: relative; width: 100%; text-align: center; }
        .apply-blink { animation: led-blink-animation 0.8s step-end infinite !important; }
        @keyframes led-blink-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .admin-panel { width: 800px; background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 25px; box-sizing: border-box; }
        h3 { margin-top: 0; color: #007bc3; border-bottom: 1px solid #2d2d2d; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; color: #aaa; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 15px; background-color: #0a0a0a; border: 1px solid #3c3c3c; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .row .form-group { flex: 1; }
        select { padding: 10px; font-size: 16px; background-color: #0a0a0a; border: 1px solid #3c3c3c; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #007bc3; color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #008be2; }
        .record-section { margin-top: 20px; padding-top: 20px; border-top: 1px dashed #444; }
        .btn-record { background-color: #cc0000; }
        .btn-record:hover { background-color: #ff1a1a; }
        .btn-record.recording { background-color: #555; animation: rec-blink 1s infinite; }
        @keyframes rec-blink { 50% { background-color: #aa0000; } }
        .hint { font-size: 12px; color: #888; font-weight: normal; margin-top: 2px; }
        #current-status { text-align: center; color: #666; font-size: 14px; margin-bottom: 15px; }
        @keyframes led-step-scroll { 0% { transform: translateX(800px); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="led-container">
        <div class="led-text" id="ledText"></div>
        <div class="led-dot-mask"></div>
    </div>

    <div id="current-status">表示ステータス: 待機中</div>

    <div class="admin-panel">
        <h3>運行表示 設定パネル</h3>
        <div class="form-group">
            <label for="inputText">表示する文字列 <span class="hint">※[g:文字]で緑色、[r:文字]で赤色、[y:文字]で橙色</span></label>
            <input type="text" id="inputText" value="次は [g:渋谷] です。お出口は [r:右側] です。 Next is [g:Shibuya].">
        </div>
        <div class="row">
            <div class="form-group">
                <label for="colorSelect">LEDの色（全体一括設定）</label>
                <select id="colorSelect">
                    <option value="custom">上記の個別タグ設定を優先する</option>
                    <option value="amber">全体を一括で 橙色 にする</option>
                    <option value="green">全体を一括で 緑色 にする</option>
                    <option value="red">全体を一括で 赤色 にする</option>
                </select>
            </div>
            <div class="form-group">
                <label for="modeSelect">表示モード</label>
                <select id="modeSelect">
                    <option value="scroll">実車風スクロール（カクカク流れる）</option>
                    <option value="blink">点滅（カチカチ明滅）</option>
                    <option value="fixed">中央固定（常時点灯）</option>
                </select>
            </div>
        </div>
        <button onclick="applyCustomText()">LED表示を更新する</button>
        <div class="record-section">
            <button id="recordBtn" class="btn-record" onclick="toggleRecording()">📹 MP4（動画）として録画・書き出しを開始</button>
        </div>
    </div>

    <script>
        const ledText = document.getElementById("ledText"), statusDiv = document.getElementById("current-status"), recordBtn = document.getElementById("recordBtn");
        let mediaRecorder, recordedChunks = [], isRecording = false;

        function parseCustomTags(t) { return t.replace(/\[g:(.*?)\]/g, '<span class="g">$1</span>').replace(/\[r:(.*?)\]/g, '<span class="r">$1</span>').replace(/\[y:(.*?)\]/g, '<span class="y">$1</span>'); }
        function getCleanTextLength(t) { return t.replace(/\[[gry]:(.*?)\]/g, '$1').length; }

        function applyCustomText() {
            const raw = document.getElementById("inputText").value, col = document.getElementById("colorSelect").value, mod = document.getElementById("modeSelect").value;
            ledText.innerHTML = parseCustomTags(raw);
            ledText.style.animation = 'none'; ledText.className = 'led-text'; ledText.offsetHeight;
            if (col !== "custom") ledText.classList.add(`color-${col}`);

            if (mod === "scroll") {
                const steps = Math.ceil((800 + ledText.offsetWidth) / 3);
                ledText.style.animation = `led-step-scroll ${getCleanTextLength(raw) * 0.25 + 4}s steps(${steps}) infinite`;
                statusDiv.innerText = "表示ステータス: 実車風ステップスクロール中";
            } else if (mod === "blink") {
                ledText.classList.add("mode-center-layout", "apply-blink");
                statusDiv.innerText = "表示ステータス: 固定点滅中";
            } else {
                ledText.classList.add("mode-center-layout");
                statusDiv.innerText = "表示ステータス: 中央固定表示中";
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                recordedChunks = [];
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 800, height: 90, frameRate: 30 }, audio: false });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'video/mp4' }), url = URL.createObjectURL(blob), a = document.createElement('a');
                        a.href = url; a.download = 'led-simulation.mp4'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start(); isRecording = true;
                    recordBtn.innerText = "🛑 録画中...（もう一度押すとMP4を保存）"; recordBtn.classList.add("recording");
                } catch (err) { alert("画面キャプチャが許可されませんでした。"); }
            } else {
                mediaRecorder.stop(); isRecording = false;
                recordBtn.innerText = "📹 MP4（動画）として録画・書き出しを開始"; recordBtn.classList.remove("recording"); applyCustomText();
            }
        }
        applyCustomText();
    </script>
</body>
</html>
